[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guap-skill"
version = "0.1.0"
description = "Standalone GUAP CLI and Agent Skill with teacher and subject references"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "playwright>=1.40",
]

[project.scripts]
guap-pro = "guap:main"

[tool.setuptools]
py-modules = ["guap"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
